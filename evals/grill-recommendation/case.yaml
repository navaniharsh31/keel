schema_version: "1.1"
name: grill-recommendation
description: "A grill round where one option (nearest-cent rounding) was just shown to fail a covered case: the recommendation handles every covered case, so nearest-cent is not recommended."
tags: [regression, grill]
execution:
  prompt: "OK, next round."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl

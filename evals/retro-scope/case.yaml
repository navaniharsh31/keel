schema_version: "1.1"
name: retro-scope
description: "A retro with a code-change candidate (a second unclamped percentage) and no AskUserQuestion: it edits no product code and commits nothing without a pick."
tags: [regression, retro]
execution:
  prompt: "Before the review, run the retro: what would have prevented this?"
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl

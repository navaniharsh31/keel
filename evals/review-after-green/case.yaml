schema_version: "1.1"
name: review-after-green
description: "A debug session whose suite just went green goes on to keel:review in its current shape (each reviewer reads its brief by path, no bundled /code-review), and nothing is merged."
tags: [regression, bug]
execution:
  prompt: "Go ahead with Phase 7."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Agent]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl

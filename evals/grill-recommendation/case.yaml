schema_version: "1.1"
name: grill-recommendation
description: "A grill round where one option (nearest-cent rounding) was just shown to fail a covered case: it is not the recommendation, or its failing case is named as its cost in a question of its own."
tags: [regression, grill]
execution:
  prompt: "OK, next round."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl

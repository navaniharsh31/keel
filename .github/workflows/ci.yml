name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint prose
        run: scripts/lint.sh
      - name: Test hooks (dash, as /bin/sh on Ubuntu)
        run: |
          scripts/test-session-start.sh
          scripts/test-context-check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin (strict)
        run: scripts/validate.sh
